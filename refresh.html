<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071421"><title>Actualizar RM 26/27</title><style>html,body{margin:0;background:#071421;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}body{display:grid;place-items:center;padding:24px}.box{max-width:460px;text-align:center}.spin{width:40px;height:40px;border:4px solid #ffffff33;border-top-color:#fff;border-radius:50%;margin:0 auto 20px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#b7c7d9;line-height:1.5}</style></head><body><div class="box"><div class="spin"></div><h1>Actualizando RM 26/27…</h1><p>Estamos eliminando la caché antigua y cargando la versión más reciente.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/real-madrid-2627/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('rm2627-')).map(k=>caches.delete(k)))}}catch(e){console.warn(e)}const u=new URL('./',location.href);u.searchParams.set('fresh','20260913-1305');location.replace(u.href)})()</script></body></html>
