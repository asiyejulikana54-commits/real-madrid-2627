name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate season update flow
        run: node scripts/validate-season-update.cjs

      - name: Validate public frontend
        run: |
          node --check community.js
          node --check matchday.js
          node --check compare-pro.js
          node --check stats-pro.js
          node --check public-polish.js
          node --check public-engagement.js
          node --check share-cards.js
          node --check personal-hub.js
          node --check personal-nav.js
          node --check playerhub.js
          node --check player-experience.js
          node --check site-guide.js
          node --check personal-home.js
          node --check ux-cleanup.js
          node --check ux-refine.js
          node --check visual-system.js
          node --check ux-dedupe.js
          node --check mobile-ux.js
          grep -q "public-engagement.js?v=3" public-polish.js
          grep -q "site-guide.js?v=1" public-polish.js
          grep -q "site-guide.css?v=1" public-polish.js
          grep -q "personal-home.js?v=1" public-polish.js
          grep -q "personal-home.css?v=1" public-polish.js
          grep -q "compare-pro.js?v=1" public-polish.js
          grep -q "compare-pro.css?v=1" public-polish.js
          grep -q "loadComparePro" public-polish.js
          grep -q "stats-pro.js?v=1" public-polish.js
          grep -q "stats-pro.css?v=1" public-polish.js
          grep -q "loadStatsPro" public-polish.js
          grep -q "share-cards.js?v=2" public-polish.js
          grep -q "RMComparePro" compare-pro.js
          grep -q "VEREDICTO ACTUAL" compare-pro.js
          grep -q "Duelos rápidos" compare-pro.js
          grep -q "Forma reciente" compare-pro.js
          grep -q "Min / punto" compare-pro.js
          grep -q "RMStatsPro" stats-pro.js
          grep -q "FILTRO ACTUAL" stats-pro.js
          grep -q "spSort" stats-pro.js
          grep -q "Power RM" stats-pro.js
          grep -q "Toda la muestra" stats-pro.js
          grep -q "SC no equivale a 0" stats-pro.js
          grep -q "predictionResultCard" share-cards.js
          grep -q "drawQr" share-cards.js
          grep -q "requestIdleCallback" community.js
          grep -q "matchday.js?v=3" community.js
          grep -q "communityBackendAvailable" community.js
          grep -q "RMMatchdayCenter" matchday.js
          grep -q "function phase" matchday.js
          grep -q "backendAvailable" matchday.js
          grep -q "matchday.css?v=3" matchday.js
          grep -q "DUDAS CLAVE" matchday.js
          grep -q "rm_matchday_seen_phase_v1" matchday.js
          grep -q "COMPARACIÓN CON EL XI REAL" matchday.js
          grep -q "ANÁLISIS INCORPORADO" matchday.js
          grep -q "playerhub.js?v=2" community.js
          grep -q "player-experience.js?v=1" community.js
          grep -q "player-experience.css?v=1" community.js
          grep -q "RMPlayerExperience" player-experience.js
          grep -q "rm_player_favorites_v1" player-experience.js
          grep -q "rm_player_recents_v1" player-experience.js
          grep -q "FORMA PARTIDO A PARTIDO" player-experience.js
          grep -q "RMSiteGuide" site-guide.js
          grep -q "DICCIONARIO RÁPIDO" site-guide.js
          grep -q "RMPersonalHome" personal-home.js
          grep -q "TU SIGUIENTE PASO" personal-home.js
          grep -q "DESDE TU ÚLTIMA VISITA" personal-home.js
          grep -q "rm_player_favorites_v1" personal-home.js
          grep -q "public-polish.js?v=7" ux-cleanup.js
          grep -q "uxInstallRM" ux-cleanup.js
          grep -q "Instalar RM 26/27" ux-cleanup.js
          grep -q "rm_prediction_history_v1" personal-hub.js
          grep -q "rmGlobalSearch" personal-hub.js
          grep -q "Compartir enlace" personal-hub.js
          grep -q "mi-temporada" personal-nav.js
          grep -q 'personal-hub.js?v=1' index.html
          grep -q 'personal-nav.js?v=1' index.html
          grep -q 'personal-hub.css?v=1' index.html
          if grep -Eq "new MutationObserver|MutationObserver\\(" ux-cleanup.js ux-refine.js visual-system.js ux-dedupe.js mobile-ux.js personal-hub.js personal-nav.js playerhub.js player-experience.js site-guide.js personal-home.js matchday.js compare-pro.js stats-pro.js; then
            echo "No se permiten observadores DOM en las capas de experiencia validadas"; exit 1;
          fi

      - name: Validate PWA
        run: |
          node --check pwa.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          grep -q 'rel="manifest" href="manifest.webmanifest"' index.html
          grep -q 'pwa.css?v=2' index.html
          grep -q 'pwa.js?v=2' index.html
          grep -q 'community.js?v=3' index.html
          grep -q 'ux-cleanup.js?v=7' index.html
          grep -q 'window.RMPWA' pwa.js
          grep -q 'showInstallGuide' pwa.js
          grep -q 'personal-hub.js' sw.js
          grep -q 'personal-nav.js' sw.js
          grep -q 'playerhub.js' sw.js
          grep -q 'player-experience.js' sw.js
          grep -q 'player-experience.css' sw.js
          grep -q 'site-guide.js' sw.js
          grep -q 'site-guide.css' sw.js
          grep -q 'personal-home.js' sw.js
          grep -q 'personal-home.css' sw.js
          grep -q 'matchday.js' sw.js
          grep -q 'matchday.css' sw.js
          grep -q 'compare-pro.js' sw.js
          grep -q 'compare-pro.css' sw.js
          grep -q 'stats-pro.js' sw.js
          grep -q 'stats-pro.css' sw.js
          grep -q "rm2627-static-v11" sw.js
          grep -q 'app-icon.svg' manifest.webmanifest
          grep -q '/.netlify/functions/' sw.js

      - name: Bust public experience cache
        run: |
          sed -i 's/community.js?v=3/community.js?v=7/' index.html
          sed -i 's/ux-cleanup.js?v=7/ux-cleanup.js?v=9/' index.html
          sed -i 's/public-polish.js?v=7/public-polish.js?v=8/' ux-cleanup.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
