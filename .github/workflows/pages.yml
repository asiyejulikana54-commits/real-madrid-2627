name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate season update flow
        run: |
          node scripts/validate-season-update.cjs
          node scripts/validate-rayo-data.cjs

      - name: Validate public frontend
        run: |
          for file in *.js; do node --check "$file"; done
          node scripts/validate-pro-surface.cjs
          node scripts/validate-engagement.cjs
          node scripts/validate-navigation-history.cjs
          node scripts/validate-match-story.cjs
          node scripts/validate-compare-lifecycle.cjs
          node scripts/validate-power-sorting.cjs

      - name: Validate PWA
        run: node scripts/validate-pwa.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
