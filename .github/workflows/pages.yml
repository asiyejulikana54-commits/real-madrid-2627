name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate season update flow
        run: node scripts/validate-season-update.cjs

      - name: Validate public frontend
        run: |
          node --check community.js
          node --check matchday.js
          node --check compare-pro.js
          node --check stats-pro.js
          node --check match-history-pro.js
          node --check prediction-pro.js
          node --check lineup-pro.js
          node --check evolution-pro.js
          node --check decisionradar.js
          node --check hierarchy.js
          node --check accessibility.js
          node --check command-palette.js
          node --check public-polish.js
          node --check public-engagement.js
          node --check share-cards.js
          node --check personal-hub.js
          node --check personal-nav.js
          node --check playerhub.js
          node --check player-experience.js
          node --check site-guide.js
          node --check personal-home.js
          node --check ux-cleanup.js
          node --check ux-refine.js
          node --check visual-system.js
          node --check ux-dedupe.js
          node --check mobile-ux.js
          grep -q "public-engagement.js?v=3" public-polish.js
          grep -q "site-guide.js?v=1" public-polish.js
          grep -q "site-guide.css?v=1" public-polish.js
          grep -q "personal-home.js?v=1" public-polish.js
          grep -q "personal-home.css?v=1" public-polish.js
          grep -q "compare-pro.js?v=1" public-polish.js
          grep -q "compare-pro.css?v=1" public-polish.js
          grep -q "loadComparePro" public-polish.js
          grep -q "stats-pro.js?v=1" public-polish.js
          grep -q "stats-pro.css?v=1" public-polish.js
          grep -q "loadStatsPro" public-polish.js
          grep -q "match-history-pro.js?v=1" public-polish.js
          grep -q "match-history-pro.css?v=1" public-polish.js
          grep -q "loadMatchHistoryPro" public-polish.js
          grep -q "prediction-pro.js?v=1" public-polish.js
          grep -q "prediction-pro.css?v=1" public-polish.js
          grep -q "loadPredictionPro" public-polish.js
          grep -q "lineup-pro.js?v=1" public-polish.js
          grep -q "lineup-pro.css?v=1" public-polish.js
          grep -q "loadLineupPro" public-polish.js
          grep -q "evolution-pro.js?v=1" public-polish.js
          grep -q "evolution-pro.css?v=1" public-polish.js
          grep -q "loadEvolutionPro" public-polish.js
          grep -q "accessibility.js?v=1" public-polish.js
          grep -q "accessibility.css?v=1" public-polish.js
          grep -q "loadAccessibility" public-polish.js
          grep -q "command-palette.js?v=1" public-polish.js
          grep -q "command-palette.css?v=1" public-polish.js
          grep -q "loadCommandPalette" public-polish.js
          grep -q "share-cards.js?v=2" public-polish.js
          grep -q "RMComparePro" compare-pro.js
          grep -q "VEREDICTO ACTUAL" compare-pro.js
          grep -q "Duelos rápidos" compare-pro.js
          grep -q "Forma reciente" compare-pro.js
          grep -q "Min / punto" compare-pro.js
          grep -q "RMStatsPro" stats-pro.js
          grep -q "FILTRO ACTUAL" stats-pro.js
          grep -q "spSort" stats-pro.js
          grep -q "Power RM" stats-pro.js
          grep -q "Toda la muestra" stats-pro.js
          grep -q "SC no equivale a 0" stats-pro.js
          grep -q "RMMatchHistoryPro" match-history-pro.js
          grep -q "HISTORIAL PRO" match-history-pro.js
          grep -q "MEJORES NOTAS" match-history-pro.js
          grep -q "MÁS MINUTOS" match-history-pro.js
          grep -q "Vs anterior" match-history-pro.js
          grep -q "SC nunca equivale a 0" match-history-pro.js
          grep -q "RMPredictionPro" prediction-pro.js
          grep -q "Coinciden con nuestra propuesta" prediction-pro.js
          grep -q "Cambios sin guardar" prediction-pro.js
          grep -q "pp-mobile-bar" prediction-pro.css
          grep -q "RMLineupPro" lineup-pro.js
          grep -q "BANQUILLO RÁPIDO" lineup-pro.js
          grep -q "XI válido" lineup-pro.js
          grep -q "No puedes repetir" lineup-pro.js
          grep -q "lp-mobile-bar" lineup-pro.css
          grep -q "RMEvolutionPro" evolution-pro.js
          grep -q "RACHA 7+" evolution-pro.js
          grep -q "Momentum:" evolution-pro.js
          grep -q "SC no entra como 0" evolution-pro.js
          grep -q "ep-player-row" evolution-pro.css
          grep -q "RMDecisionRadar" decisionradar.js
          grep -q "VENTAJA REAL" decisionradar.js
          grep -q "DUELO ABIERTO" decisionradar.js
          grep -q "MUESTRA INSUFICIENTE" decisionradar.js
          grep -q "Por qué gana cada criterio" decisionradar.js
          grep -q "backendAvailable" decisionradar.js
          grep -q "radar-decision" decisionradar.css
          grep -q "radar-confidence" decisionradar.css
          grep -q "RMHierarchyPro" hierarchy.js
          grep -q "JERARQUÍAS PRO" hierarchy.js
          grep -q "confianza de muestra" hierarchy.js
          grep -q "hierarchyToRadar" hierarchy.js
          grep -q "hierarchyToCompare" hierarchy.js
          grep -q "h-position-status" hierarchy.css
          grep -q "h-confidence" hierarchy.css
          grep -q "RMAccessibility" accessibility.js
          grep -q "a11ySkip" accessibility.js
          grep -q "aria-live" accessibility.js
          grep -q "trapTab" accessibility.js
          grep -q "prefers-reduced-motion" accessibility.css
          grep -q "focus-visible" accessibility.css
          grep -q "RMCommandPalette" command-palette.js
          grep -q "comparar Güler con Brahim" command-palette.js
          grep -q "rm_command_recent_v1" command-palette.js
          grep -q "cp-item" command-palette.css
          grep -q "robustNavigate" mobile-ux.js
          grep -q "directActivate" mobile-ux.js
          grep -q "selectstart" mobile-ux.js
          grep -q "touchAction='manipulation'" mobile-ux.js
          grep -q "mobile-ux.js?v=3" ux-dedupe.js
          grep -q "ux-dedupe.js?v=3" visual-system.js
          grep -q "predictionResultCard" share-cards.js
          grep -q "drawQr" share-cards.js
          grep -q "requestIdleCallback" community.js
          grep -q "matchday.js?v=3" community.js
          grep -q "communityBackendAvailable" community.js
          grep -q "RMMatchdayCenter" matchday.js
          grep -q "function phase" matchday.js
          grep -q "backendAvailable" matchday.js
          grep -q "matchday.css?v=3" matchday.js
          grep -q "DUDAS CLAVE" matchday.js
          grep -q "rm_matchday_seen_phase_v1" matchday.js
          grep -q "COMPARACIÓN CON EL XI REAL" matchday.js
          grep -q "ANÁLISIS INCORPORADO" matchday.js
          grep -q "playerhub.js?v=2" community.js
          grep -q "player-experience.js?v=1" community.js
          grep -q "player-experience.css?v=1" community.js
          grep -q "RMPlayerExperience" player-experience.js
          grep -q "rm_player_favorites_v1" player-experience.js
          grep -q "rm_player_recents_v1" player-experience.js
          grep -q "FORMA PARTIDO A PARTIDO" player-experience.js
          grep -q "RMSiteGuide" site-guide.js
          grep -q "DICCIONARIO RÁPIDO" site-guide.js
          grep -q "RMPersonalHome" personal-home.js
          grep -q "TU SIGUIENTE PASO" personal-home.js
          grep -q "DESDE TU ÚLTIMA VISITA" personal-home.js
          grep -q "rm_player_favorites_v1" personal-home.js
          grep -q "public-polish.js?v=7" ux-cleanup.js
          grep -q "uxInstallRM" ux-cleanup.js
          grep -q "Instalar RM 26/27" ux-cleanup.js
          grep -q "rm_prediction_history_v1" personal-hub.js
          grep -q "rmGlobalSearch" personal-hub.js
          grep -q "Compartir enlace" personal-hub.js
          grep -q "mi-temporada" personal-nav.js
          grep -q 'personal-hub.js?v=1' index.html
          grep -q 'personal-nav.js?v=1' index.html
          grep -q 'personal-hub.css?v=1' index.html
          if grep -Eq "new MutationObserver|MutationObserver\\(" ux-cleanup.js ux-refine.js visual-system.js ux-dedupe.js mobile-ux.js personal-hub.js personal-nav.js playerhub.js player-experience.js site-guide.js personal-home.js matchday.js compare-pro.js stats-pro.js match-history-pro.js prediction-pro.js lineup-pro.js evolution-pro.js decisionradar.js hierarchy.js accessibility.js command-palette.js; then
            echo "No se permiten observadores DOM en las capas de experiencia validadas"; exit 1;
          fi

      - name: Validate PWA
        run: |
          node --check pwa.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          grep -q 'rel="manifest" href="manifest.webmanifest"' index.html
          grep -q 'pwa.css?v=2' index.html
          grep -q 'pwa.js?v=2' index.html
          grep -q 'community.js?v=3' index.html
          grep -q 'ux-cleanup.js?v=7' index.html
          grep -q 'window.RMPWA' pwa.js
          grep -q 'showInstallGuide' pwa.js
          grep -q 'personal-hub.js' sw.js
          grep -q 'personal-nav.js' sw.js
          grep -q 'playerhub.js' sw.js
          grep -q 'player-experience.js' sw.js
          grep -q 'player-experience.css' sw.js
          grep -q 'site-guide.js' sw.js
          grep -q 'site-guide.css' sw.js
          grep -q 'personal-home.js' sw.js
          grep -q 'personal-home.css' sw.js
          grep -q 'matchday.js' sw.js
          grep -q 'matchday.css' sw.js
          grep -q 'compare-pro.js' sw.js
          grep -q 'compare-pro.css' sw.js
          grep -q 'stats-pro.js' sw.js
          grep -q 'stats-pro.css' sw.js
          grep -q 'match-history-pro.js' sw.js
          grep -q 'match-history-pro.css' sw.js
          grep -q 'prediction-pro.js' sw.js
          grep -q 'prediction-pro.css' sw.js
          grep -q 'lineup-pro.js' sw.js
          grep -q 'lineup-pro.css' sw.js
          grep -q 'evolution-pro.js' sw.js
          grep -q 'evolution-pro.css' sw.js
          grep -q 'accessibility.js' sw.js
          grep -q 'accessibility.css' sw.js
          grep -q 'command-palette.js' sw.js
          grep -q 'command-palette.css' sw.js
          grep -q 'decisionradar.js' sw.js
          grep -q 'decisionradar.css' sw.js
          grep -q 'hierarchy.js' sw.js
          grep -q 'hierarchy.css' sw.js
          grep -q 'mobile-ux.js' sw.js
          grep -q 'mobile-ux.css' sw.js
          grep -q 'ux-dedupe.js' sw.js
          grep -q "rm2627-static-v19" sw.js
          grep -q 'app-icon.svg' manifest.webmanifest
          grep -q '/.netlify/functions/' sw.js

      - name: Bust public experience cache
        run: |
          sed -i 's/community.js?v=3/community.js?v=7/' index.html
          sed -i 's/ux-cleanup.js?v=7/ux-cleanup.js?v=9/' index.html
          sed -i 's/public-polish.js?v=7/public-polish.js?v=9/' ux-cleanup.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
