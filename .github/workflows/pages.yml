name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate season update flow
        run: node scripts/validate-season-update.cjs

      - name: Validate public frontend
        run: |
          for file in *.js; do node --check "$file"; done
          node scripts/validate-pro-surface.cjs
          node scripts/validate-engagement.cjs
          node scripts/validate-decision-profile.cjs
          node scripts/validate-decision-coach.cjs
          node scripts/validate-review-archive.cjs
          node scripts/validate-decision-center.cjs
          node scripts/validate-season-learning.cjs
          node scripts/validate-post-xi-center.cjs

      - name: Validate PWA
        run: node scripts/validate-pwa.cjs

      - name: Bust public experience cache
        run: |
          sed -i 's/community.js?v=3/community.js?v=7/' index.html
          sed -i 's/ux-cleanup.js?v=7/ux-cleanup.js?v=9/' index.html
          sed -i 's/public-polish.js?v=7/public-polish.js?v=9/' ux-cleanup.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
