name: Validate engagement loop

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate engagement loop
        run: node scripts/validate-engagement.cjs
      - name: Validate decision profile
        run: node scripts/validate-decision-profile.cjs
      - name: Validate decision coach
        run: node scripts/validate-decision-coach.cjs
      - name: Validate review archive
        run: node scripts/validate-review-archive.cjs
      - name: Validate season learning
        run: node scripts/validate-season-learning.cjs
      - name: Validate post-XI center
        run: node scripts/validate-post-xi-center.cjs
      - name: Validate simple mode
        run: node scripts/validate-simple-mode.cjs