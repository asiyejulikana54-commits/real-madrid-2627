<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071421">
<title>Actualizar RM 26/27</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071421;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;padding:24px}.box{width:min(560px,100%);background:#0f1d30;border:1px solid #20344e;border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0 0 10px;font-size:28px}p{color:#a9bad0;line-height:1.5}.status{margin-top:18px;padding:14px;border-radius:14px;background:#091522;border:1px solid #20344e;font-weight:800}.ok{color:#47d18c}.err{color:#ff9ba4}button,a{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;border:0;border-radius:12px;padding:12px 16px;background:#f4f7fb;color:#071421;font-weight:900;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<main class="box">
<h1>Actualizar RM 26/27</h1>
<p>Esta página elimina únicamente la caché y el service worker de este proyecto para sacar al móvil de una versión antigua. No borra tus datos locales de la app.</p>
<div id="status" class="status">Limpiando versión antigua…</div>
<button id="retry" hidden>Reintentar</button>
<a id="open" href="./?fresh=1" hidden>Abrir versión nueva</a>
</main>
<script>
(async()=>{
  const status=document.getElementById('status'),retry=document.getElementById('retry'),open=document.getElementById('open');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/real-madrid-2627/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('rm2627-')).map(k=>caches.delete(k)));
    }
    status.textContent='Versión antigua eliminada. Abriendo la versión nueva…';
    status.classList.add('ok');
    const target='./?fresh='+Date.now();
    open.href=target;open.hidden=false;
    setTimeout(()=>location.replace(target),900);
  }catch(e){
    status.textContent='No se pudo limpiar automáticamente. Pulsa Reintentar o abre la versión nueva.';
    status.classList.add('err');retry.hidden=false;open.hidden=false;
    retry.onclick=()=>location.reload();open.href='./?fresh='+Date.now();
  }
})();
</script>
</body>
</html>
