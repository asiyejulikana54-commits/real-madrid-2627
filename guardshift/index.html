async function handleAuth(e,mode){
 e.preventDefault();var f=new FormData(e.target),res;
 if(mode==='signup'){
   res=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{full_name:f.get('name')},emailRedirectTo:location.href}});

 }else{
   res=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});

 }

async function boot(){

     }
   }
   auth();return

   var inviteToken=new URLSearchParams(location.search).get('invite');
   if(inviteToken){
     var inviteClaim=await sb.rpc('claim_worker_invite',{p_token:inviteToken});

 state.company=c.data;await ensureServiceWorker();await load();setupRealtime();render();if(state.profile.role==='worker'&&'Notification' in window&&Notification.permission==='granted')registerPushSubscription().catch(function(){});

function timeOnDay(day,timeText){
 var p=String(timeText||'').split(':'),x=new Date(day);
 x.setHours(Number(p[0]||0),Number(p[1]||0),Number(p[2]||0),0);
 return x;
}
function hasWeeklyCoverage(f){
 var x=f&&f.coverage_schedule;
 return !!(x&&typeof x==='object'&&!Array.isArray(x)&&Object.keys(x).length);
}
function facilityCoverageConfigured(f){
 return hasWeeklyCoverage(f)||!!(f&&f.coverage_start&&f.coverage_end);
}
function facilityCoverageConfig(f,day){
 if(hasWeeklyCoverage(f)){
   var cfg=f.coverage_schedule[String(day.getDay())];
   if(!cfg||cfg.enabled===false||!cfg.start||!cfg.end)return null;
   return {start:String(cfg.start).slice(0,5),end:String(cfg.end).slice(0,5),required:Math.max(1,Number(cfg.required||f.required_workers||1)),weekly:true};
 }
 if(f.coverage_start&&f.coverage_end){
   return {start:String(f.coverage_start).slice(0,5),end:String(f.coverage_end).slice(0,5),required:Math.max(1,Number(f.required_workers||1)),weekly:false};
 }
 return undefined;
}
function coverageSummary(f){
 if(hasWeeklyCoverage(f)){
   var enabled=Object.keys(f.coverage_schedule).filter(function(k){var x=f.coverage_schedule[k];return x&&x.enabled!==false&&x.start&&x.end}).length;
   return enabled?('Horario semanal · '+enabled+' día'+(enabled===1?'':'s')):'Horario semanal · cerrado';
 }
 if(f.coverage_start&&f.coverage_end)return 'Cobertura '+String(f.coverage_start).slice(0,5)+'–'+String(f.coverage_end).slice(0,5);
 return 'Cobertura sin configurar';
}
function coverageGapsForFacility(f,day){
 var cfg=facilityCoverageConfig(f,day);
 if(cfg===undefined)return null;
 if(cfg===null)return [];
 var start=timeOnDay(day,cfg.start),end=timeOnDay(day,cfg.end);
 if(end<=start)end.setDate(end.getDate()+1);
 var relevant=state.shifts.filter(function(sh){
   if(sh.facility_id!==f.id||sh.status!=='assigned'||!sh.worker_id)return false;
   var ss=new Date(sh.starts_at),se=new Date(sh.ends_at);
   if(!(ss<end&&se>start))return false;
   if(approvedLeaveForShift(sh.worker_id,ss,se))return false;
   return true;
 });
 var points=[start.getTime(),end.getTime()];
 relevant.forEach(function(sh){
   var a=Math.max(start.getTime(),new Date(sh.starts_at).getTime()),b=Math.min(end.getTime(),new Date(sh.ends_at).getTime());
   if(a<b){points.push(a,b)}
 });
 points=Array.from(new Set(points)).sort(function(a,b){return a-b});
 var need=cfg.required,gaps=[];
 for(var i=0;i<points.length-1;i++){
   var a=points[i],b=points[i+1];if(b<=a)continue;
   var mid=(a+b)/2,count=relevant.filter(function(sh){return new Date(sh.starts_at).getTime()<=mid&&new Date(sh.ends_at).getTime()>mid}).length;
   if(count<need){
     var prev=gaps[gaps.length-1];
     if(prev&&prev.end===a&&prev.assigned===count){prev.end=b}
     else gaps.push({start:a,end:b,assigned:count,need:need});
   }
 }
 return gaps;
}
function formatCoverageGap(g){
 return t(new Date(g.start))+'–'+t(new Date(g.end))+' · '+g.assigned+'/'+g.need+' cubiertos · faltan '+(g.need-g.assigned);
}

function localDateKey(v){

}
function dateKeyInTimeZone(v,zone){
 var x=v instanceof Date?v:new Date(v),tz=zone||'Europe/Madrid';
 try{
   var parts=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(x),map={};
   parts.forEach(function(p){if(p.type!=='literal')map[p.type]=p.value});
   return map.year+'-'+map.month+'-'+map.day;
 }catch(_){return localDateKey(x)}
}

   '<div class="filters"><input id="leaveSearch" placeholder="Buscar trabajador"><select id="leaveStatus"><option value="">Todos los estados</option><option value="pending">Pendientes</option><option value="approved">Aprobadas</option><option value="rejected">Rechazadas</option><option value="cancelled">Canceladas</option></select><select id="leaveType"><option value="">Todos los tipos</option><option value="vacation">Vacaciones</option><option value="personal">Asunto personal</option><option value="sick">Baja / enfermedad</option><option value="other">Otro</option></select><button class="btn secondary" id="leaveCsv">Exportar CSV</button></div><div id="leaveArchive"></div>'+

   shell('Ausencias','Aprueba solicitudes y resuelve de forma preventiva los turnos afectados.',body,'');
   var current=[];

   document.getElementById('leaveCsv').onclick=function(){var rows=current.length?current:list;if(!rows.length){alert('No hay solicitudes para exportar.');return}var csv='Trabajador,Tipo,Desde,Hasta,Dias,Estado,Turnos coincidentes,Motivo,Nota revision\n'+rows.map(function(x){var w=x.workers||{};return [w.full_name||'',leaveTypeLabel(x.leave_type),x.starts_on,x.ends_on,leaveDays(x),x.status,leaveConflictingShifts(x).length,x.reason||'',x.review_note||''].map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='guardshift_ausencias.csv';a.click();URL.revokeObjectURL(a.href)};
 }
}
function incidentsPage(){
 if(state.profile.role==='worker'){
  var opts='<option value="">Sin turno asociado</option>'+state.shifts.filter(function(x){return x.worker_id===state.profile.worker_id}).map(function(x){return '<option value="'+x.id+'">'+d(x.starts_at)+' · '+esc(x.facilities&&x.facilities.name||'Turno')+'</option>'}).join('');

  shell('Incidencias','Comunica problemas o hechos relevantes.',body,'');
  document.getElementById('incidentForm').onsubmit=async function(e){e.preventDefault();var f=new FormData(e.target);var r=await sb.from('incidents').insert({company_id:state.profile.company_id,worker_id:state.profile.worker_id,shift_id:f.get('shift')||null,incident_type:f.get('type'),severity:f.get('severity'),title:f.get('title'),description:f.get('description')});if(r.error){ferr(e.target,r.error.message);return}await load();render()};

 if(!list.length)return '<div class="card empty">No hay incidencias registradas.</div>';

   ? {workerhome:workerhome,myshifts:myshifts,clocking:clocking,workerhours:workerHoursPage,offers:offers,availability:availability,leave:leavePage,incidents:incidentsPage,mydocuments:mydocuments}
   : {dashboard:dashboard,operations:operationsPage,workforce:workforcePlanningPage,facilities:facilities,workers:workers,shifts:shifts,schedule:schedule,coverage:coveragePlannerPage,summary:summaryPage,substitutions:substitutionsPage,hours:hoursPage,leave:leavePage,incidents:incidentsPage,documents:documentsPage,compliance:compliancePage};
 if(state.profile&&state.profile.role==='worker'&&['dashboard','operations','workforce','schedule','coverage','facilities','workers','shifts','substitutions','documents','compliance'].indexOf(state.page)>=0)state.page='workerhome';

async function logout(){await sb.auth.signOut();if(state.realtime){sb.removeChannel(state.realtime)}state={session:null,profile:null,company:null,page:'dashboard',facilities:[],workers:[],shifts:[],offers:[],availability:[],substitutions:[],documents:[],timeEntries:[],incidents:[],leaveRequests:[],timeLocations:[],timeAudit:[],timeCorrectionRequests:[],timesheetClosures:[],timesheetClosureEvents:[],payrollReconciliation:[],notificationEvents:[],shiftChangeRequests:[],claimableOpenShifts:[],shiftEvents:[],documentEvents:[],documentNotifications:[],leaveEvents:[],substitutionEvents:[],substitutionNotifications:[],staffingCandidates:[],operationsHorizon:14,workforceHorizon:14,summaryMode:'week',summaryOffset:0,scheduleOffset:0,coverageOffset:0,workerHoursMode:'month',workerHoursOffset:0,hoursMode:'month',hoursOffset:0,hoursFilter:'all',realtime:null};auth()}
function readableError(err){
 if(!err)return 'Error desconocido.';
 if(typeof err==='string')return err;
 if(err.message)return err.message;
 try{return JSON.stringify(err)}catch(_){return 'Error inesperado.'}
}
function recovery(err,context){
 var detail=readableError(err),ctx=context||'GuardShift ha encontrado un error inesperado.';
 app.innerHTML='<div class="auth"><div class="auth-card"><div class="logo">🛟 GuardShift</div><h2>No se ha podido completar la carga</h2><p>'+esc(ctx)+'</p><div class="msg err">'+esc(detail)+'</div><p class="muted">Tus datos permanecen guardados. Puedes reintentar la carga o recargar completamente la aplicación.</p><div class="mini-actions"><button class="btn primary" id="retryGuardShift">Reintentar</button><button class="btn secondary" id="reloadGuardShift">Recargar</button>'+(state.session?'<button class="btn secondary" id="logoutGuardShift">Cerrar sesión</button>':'')+'</div></div></div>';
 var retry=document.getElementById('retryGuardShift');if(retry)retry.onclick=async function(){retry.disabled=true;retry.textContent='Reintentando…';if(state.realtime){try{await sb.removeChannel(state.realtime)}catch(_){ }state.realtime=null}safeBoot()};
 var reload=document.getElementById('reloadGuardShift');if(reload)reload.onclick=function(){location.reload()};
 var out=document.getElementById('logoutGuardShift');if(out)out.onclick=logout;
}
function fatal(x){recovery(x,'No se pudo cargar correctamente la información de GuardShift.')}
async function safeBoot(){
 try{await boot()}
 catch(e){recovery(e,'No se pudo iniciar GuardShift.')}
}
window.addEventListener('error',function(ev){
 if(ev&&ev.error)recovery(ev.error,'Se ha producido un error inesperado en GuardShift.');
});
window.addEventListener('unhandledrejection',function(ev){
 if(ev&&ev.preventDefault)ev.preventDefault();
 recovery(ev&&ev.reason?ev.reason:'Promesa rechazada','Se ha producido un error inesperado al completar una operación.');
});
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')auth()});safeBoot();
})();
